<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>Citation Graph</title>
	<link rel="stylesheet" href="graph.css"/>
</head>
<body>
	<!-- The shape of Zotero's own library tab: a bar across the top, and under it
	     a side pane beside the thing the tab is actually of. Where the library
	     puts New Collection this puts Toggle Sidebar, and where it puts the
	     collection tree this puts the settings with the legend beneath them.

	     The controls used to float over the canvas, on the argument that the
	     graph is the point of the window. The cost was that they floated over
	     NODES: the four corners of the picture were never quite yours, and the
	     tab looked like nothing else in the application. A pane takes its width
	     from the graph honestly and gives the rest back whole. -->
	<div id="frame">
		<!-- The top bar. Left: the two buttons that act on the view. Right: the
		     search field, which is where the library's is, and the button that
		     brings the item pane back, which is where the reader's is.

		     How far it runs is not this page's decision. It fills its <browser>,
		     and the browser is as wide as the item pane leaves it: with the pane
		     open the bar stops at the pane, and with the pane put away the pane
		     is out of the layout altogether and the bar has the whole tab. That
		     is the reader's tab exactly. -->
		<div id="bar">
			<button id="side-toggle" type="button" aria-expanded="true" aria-controls="side"
				data-zg-title="side-toggle-hide" data-zg-aria-label="side-toggle-hide"
				title="Hide the sidebar" aria-label="Hide the sidebar"></button>
			<!-- The two buttons are not the same kind of thing -- one puts a pane
			     away, the other moves the camera -- and the reader's toolbar marks
			     that kind of seam with a hairline rather than more space. Same
			     element and same class as .toolbar .divider there, so the rule in
			     graph.css is core's own. Decoration only: nothing to read out, so
			     it stays out of the accessibility tree. -->
			<div class="divider" role="presentation"></div>
			<!-- Up here from the bottom-left corner it used to hold. It is one of
			     the two things in this tab that act on the viewport rather than on
			     the data, and the two belong together. -->
			<button id="reframe" type="button" data-zg-title="reframe-hint" data-zg-aria-label="reframe-hint"
				title="Fit the whole graph in view" aria-label="Fit the whole graph in view"></button>
			<div id="bar-spacer"></div>
			<!-- Finds a paper and goes to it. Deliberately not a second filter: the
			     panel's chips already narrow the graph, and what had no answer until
			     now was "where in here is the paper I am thinking of".

			     Laid out as core's quick-search-textbox is: the Quick Search mode
			     menu in front, the field, and the Advanced Search button inside its
			     far end -- which opens the one search up here that does filter.
			     While an Advanced Search is open the field gives its place to
			     #adv-indicator, as core's gives its place to
			     #advanced-search-indicator. -->
			<div id="search-box">
				<button id="search-mode" type="button" aria-haspopup="menu"
					data-zg-aria-label="search-mode" aria-label="Quick Search mode"></button>
				<input id="search" type="text" autocomplete="off" spellcheck="false"
					data-zg-placeholder="search-placeholder" placeholder="Search"
					data-zg-title="search-hint"
					title="Find a paper on the canvas and go to it."
					role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest"/>
				<button id="search-clear" type="button" hidden="hidden"
					data-zg-title="search-clear" data-zg-aria-label="search-clear"
					title="Clear" aria-label="Clear"></button>
				<button id="search-advanced" type="button" tabindex="-1"
					data-zg-title="search-advanced" data-zg-aria-label="search-advanced"
					title="Advanced Search" aria-label="Advanced Search"></button>
			</div>
			<div id="adv-indicator" hidden="hidden">
				<span id="adv-label" data-zg-str="search-advanced">Advanced Search</span>
				<button id="adv-collapse" class="adv-button" type="button"
					data-zg-title="adv-collapse" data-zg-aria-label="adv-collapse"
					title="Collapse Advanced Search" aria-label="Collapse Advanced Search"></button>
				<button id="adv-close" class="adv-button" type="button"
					data-zg-title="adv-close" data-zg-aria-label="adv-close"
					title="Close Advanced Search" aria-label="Close Advanced Search"></button>
			</div>
			<!-- Brings the item pane back, and is only here while it is away.

			     There is one collapse control and it moves, which is the reader's
			     behaviour: with the pane open it is the first button of the
			     pane's own sidenav, at the top right of the tab; with the pane
			     put away the sidenav has gone with it and this takes its place --
			     at the end of a bar that now reaches the same edge, which is the
			     same spot on screen. What moves between the two states is how far
			     the bar and the pane each reach, not where the button is.

			     Same icon as the sidebar's toggle at the other end, mirrored, as
			     the reader mirrors it for .context-pane-toggle.

			     On screen from the moment the tab opens, before anything has been
			     clicked, because that is what the library tab does: its item
			     pane's sidenav is there with nothing selected, and the toggle on
			     it opens a pane that says how many items are in the view. This
			     button asks for the same pane and gets the same answer -- see
			     lib/graphTab.js. -->
			<button id="pane-toggle" type="button"
				data-zg-title="pane-toggle-show" data-zg-aria-label="pane-toggle-show"
				title="Show the item pane" aria-label="Show the item pane"></button>
		</div>

		<!-- The sidebar. Four collapsible sections down one scroller, and a
		     footer under them.

		     It was a single section called "settings" once, with eight groups
		     stacked inside it. Everything was in there, which meant everything
		     was equally far away: the colour menu, the strategy list and the
		     force sliders shared one fold and one scroll position, and the one
		     you wanted was reliably below the edge of a 200px pane. Four
		     sections give each question somewhere to be asked -- what pulls
		     what, which items are here at all, how the ones that are here get
		     drawn, and where the edges were read from -- and each remembers its
		     own fold, so the forces you have settled can be put away without
		     taking the strategies you are still arguing with down with them.

		     One scroller for all four, #side-body, so a long strategy list is
		     reached by scrolling the pane rather than a box inside it. The
		     footer is outside it and outside every section: the count and the
		     Rebuild button speak about the whole graph, not about any one
		     section, and a Rebuild that can be folded away or scrolled off the
		     bottom is a Rebuild that is missing exactly when it is wanted. -->
		<div id="side">
			<div id="side-body">
				<!-- The literal text on every control below is the fallback, not the
				     source: l10n.js overwrites anything carrying a data-zg-* id as soon
				     as chrome hands the page its strings. It is left in the markup so
				     that a page whose strings never arrive is still a usable panel
				     rather than a column of message names.

				     Every section is the same three elements -- header button, chevron,
				     body -- and graph.js wires all four from one list, so a fifth costs
				     markup and a message and no code. The whole header toggles, not just
				     the chevron: it is a wide, easy target, and there is nothing else in
				     the header to click. The titles carry a data-zg-str; the collapse
				     tooltips are set from graph.js, because which of the two a header
				     wears depends on a state the markup cannot know. -->

				<!-- Which items are on the canvas at all. The switches in the first
				     group change what gets derived, so they cost a rebuild; the masks
				     under them only narrow the graph that was built. -->
				<div class="section" id="sec-items">
					<button class="section-toggle" id="sec-items-toggle" type="button" aria-expanded="true" aria-controls="sec-items-body" title="Collapse this section">
						<span class="section-chevron"></span>
						<span class="section-title" data-zg-str="section-items">item selection</span>
					</button>
					<div class="section-body" id="sec-items-body">
						<div class="group">
							<label data-zg-title="scope-subcollections-hint" title="Include items from every subcollection">
								<input id="recursive" type="checkbox"/>
								<span data-zg-str="scope-subcollections">subcollections</span>
							</label>
							<label data-zg-title="scope-external-hint" title="Show cited works that are not in the collection">
								<input id="include-external" type="checkbox"/>
								<span data-zg-str="scope-external">outside refs</span>
							</label>
							<label id="min-cites-label" data-zg-title="scope-min-cites-hint" title="Hide outside works cited by fewer than this many of your papers">
								<span data-zg-str="scope-min-cites">cited by ≥</span>
								<input id="min-cites" type="number" min="1" max="20" step="1" value="2"/>
							</label>
							<!-- The only control that reaches the network. Off by default,
							     and independent of "outside refs": with ghosts off it still
							     has the held items' own DOIs to look up, which is where the
							     global citation counts come from. Here rather than under
							     graph display because what it fetches is what a node IS --
							     its title, its authors, its global count -- and half the
							     graph has no name to draw until it has run. -->
							<label id="enrich-label" data-zg-title="scope-enrich-hint" title="Look up citation counts, and titles and authors for outside works (uses the OpenAlex API)">
								<input id="enrich" type="checkbox"/>
								<span data-zg-str="scope-enrich">query node metadata</span>
							</label>
						</div>

						<!-- Filters. Each one is a mask over the held items, and they stack:
						     every filter added narrows what is left, never widens it. The
						     suggestions are drawn from the items that survive the filters
						     already applied, so an offered value can never empty the graph.

						     In this section because a mask IS a selection: "which items am
						     I looking at" is the question the whole section answers, and the
						     switches above are the coarse half of the same answer. -->
						<div class="group" id="filter-group">
							<div id="filter-chips"></div>
							<input id="filter-input" type="text" autocomplete="off" spellcheck="false"
								data-zg-placeholder="filter-placeholder" placeholder="filter — author:, year:, …"
								data-zg-title="filter-hint"
								title="Type a term, or field:value. Filters stack: each one narrows what is left."
								role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filter-suggest"/>
						</div>
					</div>
				</div>

				<!-- Where the edges came from: one switch per strategy, built out of the
				     payload, and the floor a derived edge's confidence has to clear to
				     be drawn at all. The threshold is here rather than among the display
				     switches because the number it filters on is the strategies' own --
				     it is the same question as which of them to trust, asked
				     continuously instead of one strategy at a time. -->
				<div class="section" id="sec-strategies">
					<button class="section-toggle" id="sec-strategies-toggle" type="button" aria-expanded="true" aria-controls="sec-strategies-body" title="Collapse this section">
						<span class="section-chevron"></span>
						<span class="section-title" data-zg-str="section-strategies">referencing strategies</span>
					</button>
					<div class="section-body" id="sec-strategies-body">
						<div id="strategies" class="group"></div>

						<div class="group">
							<label id="conf-label">
								<span data-zg-str="min-confidence">min confidence</span>
								<input id="min-conf" type="range" min="0" max="1" step="0.05" value="0"/>
								<span id="conf-value">0.00</span>
							</label>
						</div>
					</div>
				</div>

				<!-- Forces. Layout and nothing else: no node enters or leaves the
				     graph when one of these moves, and none of them costs a rebuild. -->
				<div class="section" id="sec-forces">
					<button class="section-toggle" id="sec-forces-toggle" type="button" aria-expanded="true" aria-controls="sec-forces-body" title="Collapse this section">
						<span class="section-chevron"></span>
						<span class="section-title" data-zg-str="section-forces">force adjustment</span>
					</button>
					<div class="section-body" id="sec-forces-body">
						<div class="group">
							<!-- A dense collection packs into balls because every edge pulls
							     at full strength; slackening the edges lets charge repulsion
							     win and the clusters open up far enough to read. -->
							<label id="pull-label" data-zg-title="link-pull-hint" title="How hard a link pulls its two nodes together. Lower spreads a crowded graph out.">
								<span data-zg-str="link-pull">edge pull</span>
								<input id="link-pull" type="range" min="0" max="2" step="0.05" value="1"/>
								<span id="pull-value">1.00</span>
							</label>
							<!-- The other half of the same trade. This is the pull that stops a
							     paper nothing cites from drifting off the canvas forever, so at 0
							     the unconnected ones do exactly that; turned up, the whole graph
							     gathers into a tighter disc. -->
							<label id="center-label" data-zg-title="center-pull-hint" title="How hard the middle of the canvas holds every node. At 0 unconnected papers drift away; higher packs the graph tighter.">
								<span data-zg-str="center-pull">centre pull</span>
								<input id="center-pull" type="range" min="0" max="3" step="0.05" value="1"/>
								<span id="center-value">1.00</span>
							</label>
							<!-- Every anchor's strength at once. It sat on each flag's own
							     card once, which made one question a per-anchor one: a graph
							     with four groups had four answers to "how hard does a group
							     pull", and none of them was where the other layout sliders
							     are. It is the same trade as the two above -- how far a paper
							     may be dragged from where its citations would put it -- so it
							     belongs beside them. At 0 every anchor names its papers and
							     moves none of them. -->
							<label id="group-pull-label" data-zg-title="group-pull-hint" title="How hard every anchor pulls the papers it names. At 0 they name them without moving them.">
								<span data-zg-str="group-pull">group pull</span>
								<input id="group-pull" type="range" min="0" max="1" step="0.05" value="0.4"/>
								<span id="group-pull-value">0.40</span>
							</label>
							<!-- A pin's reach, expressed the only way that keeps it about the
							     pinned paper: the links that touch it pull harder, so the works
							     citing or cited by it come to it and nothing else is disturbed.
							     At 0 a pin holds only the node it is on, which is what a pin
							     has always meant -- so that is the default. -->
							<label id="pin-pull-label" data-zg-title="pin-pull-hint" title="How much harder a pinned node's own citation links pull. At 0 a pin holds only the node it is on.">
								<span data-zg-str="pin-pull">pin pull</span>
								<input id="pin-pull" type="range" min="0" max="1" step="0.05" value="0"/>
								<span id="pin-pull-value">0.00</span>
							</label>
						</div>
					</div>
				</div>

				<!-- How the items that survived are drawn: which of them are drawn at
				     all, which are labelled, how big each is and what its colour
				     means, and what the renderer is allowed to stop drawing. -->
				<div class="section" id="sec-display">
					<button class="section-toggle" id="sec-display-toggle" type="button" aria-expanded="true" aria-controls="sec-display-body" title="Collapse this section">
						<span class="section-chevron"></span>
						<span class="section-title" data-zg-str="section-display">graph display</span>
					</button>
					<div class="section-body" id="sec-display-body">
						<div class="group">
							<!-- What a big collection gives up to stay smooth. First in this
							     section because it is the widest switch in it: it decides how
							     much of everything below it the renderer still bothers with,
							     and the first thing it turns off is the engine the force
							     sliders drive -- with it on the graph is struck once and stands
							     still, and each of those sliders re-strikes it rather than
							     setting it in motion.

							     A checkbox rather than a threshold that switches itself on:
							     which of these losses is worth which gain depends on the
							     graph and on the machine, and a mode that arrived uninvited
							     at 2000 nodes would be a renderer that changes what it draws
							     without being asked. What it costs, measured:
							     docs/performance.md. -->
							<label id="perf-label" data-zg-title="perf-hint" title="Draw a big graph faster: the layout is struck once and stands still instead of settling for fifteen seconds, and edges give up their arrows, their curve and their strategy colours. Names are untouched, and nodes still move when you drag them.">
								<input id="perf" type="checkbox"/>
								<span data-zg-str="perf-mode">performance mode</span>
							</label>
							<label>
								<input id="hide-isolated" type="checkbox"/>
								<span data-zg-str="hide-isolated">hide unconnected</span>
							</label>
							<!-- Whether the names an outside reference already has are drawn.
							     Nothing is derived or fetched for it -- it decides which of the
							     names the graph already has get asked for room in the label
							     pass, so it is paint and costs a repaint. On by default: a
							     ghost with no name is a grey dot whose only way of saying what
							     it is is the tooltip. Off is for a graph with more outside
							     references than papers, where the DOI tails they fall back to
							     are noise over the collection. -->
							<label id="ghost-names-label" data-zg-title="scope-external-names-hint" title="Draw a name on every outside reference. Off leaves them as unlabelled dots.">
								<input id="ghost-names" type="checkbox" checked="checked"/>
								<span data-zg-str="scope-external-names">outside names</span>
							</label>
							<!-- Applies to outside refs as well as held items. "global citations"
							     needs the counts "query node metadata" fetches, so picking it
							     switches that on -- in the item selection section -- and
							     rebuilds, rather than sitting here greyed out: the user asked
							     for the sizing, not for a lecture about a prerequisite. The
							     lookup is still never entered on its own. -->
							<label>
								<span data-zg-str="size-by">size</span>
								<select id="size-by">
									<option value="here" data-zg-str="size-by-here">cited here</option>
									<option value="global" data-zg-str="size-by-global">global citations</option>
								</select>
							</label>
							<label>
								<span data-zg-str="color-by">colour</span>
								<select id="color-by">
									<option value="year" data-zg-str="color-by-year">year</option>
									<option value="collection" data-zg-str="color-by-collection">collection</option>
									<option value="cluster" data-zg-str="color-by-cluster">subfield</option>
									<option value="author" data-zg-str="color-by-author">first author</option>
									<option value="publication" data-zg-str="color-by-publication">publication</option>
									<option value="type" data-zg-str="color-by-type">item type</option>
								</select>
							</label>
							<!-- What the node colours mean. Rebuilt on every render, so it only
							     ever lists colours actually visible after the filters, and hidden
							     until there is something to explain.

							     Directly under the control that decides them, and in the same
							     group, with no header and no fold of its own: the menu above it
							     already says "colour: year", so a heading repeating it was the
							     same sentence twice, and a separate fold was one more thing to
							     open before the key could be read. It is the menu's answer, and
							     it goes where the menu goes -- folding the section folds both. -->
							<div id="legend" hidden="hidden">
								<div id="legend-body"></div>
							</div>
						</div>

						<div class="group">
							<!-- How far an isolation reaches. Always visible: it is a setting
							     about how you read a graph, and one you want to be able to find
							     before you have isolated anything. -->
							<label id="depth-label" data-zg-title="isolate-depth-hint" title="How many edges out from an isolated node stays lit. 0 lights the isolated nodes and nothing else.">
								<span data-zg-str="isolate-depth">isolation depth</span>
								<input id="isolate-depth" type="number" min="0" max="4" step="1" value="1"/>
							</label>
						</div>
					</div>
				</div>
			</div>

			<!-- What the graph came to, and the button that asks for it again.
			     Outside the scroller, so it is where it was left however far down
			     the sections you are. -->
			<div id="panel-foot">
				<span id="stats"></span>
				<button id="rebuild" type="button" data-zg-str="rebuild">Rebuild</button>
			</div>

			<!-- The width handle. Laid over the pane's own right edge, so the
			     hairline you grab is the border that is already drawn there. -->
			<div id="side-grip"></div>
		</div>

		<div id="canvas-wrap">
			<div id="graph"></div>

			<!-- Nothing came back from the collection at all. Said here rather than
			     in #status because the status pill is a note in the margin of a graph
			     you are already reading, and this is the whole answer: there is no
			     graph, and the stats line in the panel has just stopped claiming one
			     is on its way. A sibling of #graph, not a child -- force-graph's
			     init() does container.innerHTML = "". -->
			<div id="empty" hidden="hidden">
				<div id="empty-title" data-zg-str="empty-title">Nothing to graph</div>
				<div id="empty-body" data-zg-str="empty-body">This collection has no regular items — only attachments, notes, or nothing at all.</div>
				<!-- Only when there is something down there to include: offering to
				     turn on a switch that would change nothing is worse than silence. -->
				<div id="empty-sub" hidden="hidden"></div>
				<button id="empty-recursive" type="button" hidden="hidden" data-zg-str="empty-include-sub">Include subcollections</button>
			</div>

			<!-- Outside #graph for the same reason as #empty. -->
			<div id="status" data-zg-str="status-loading">Loading…</div>
		</div>
	</div>

	<!-- An outside reference's detail card, opened from its context menu --
	     the answer to "tell me about this one" for a node that has no Zotero
	     item to put in the item pane. Adding to Zotero is a write to the
	     library, so from here it is behind an explicit button. The right-click
	     menu adds without asking, because a menu entry cannot be hit by
	     accident. -->
	<div id="action" hidden="hidden">
		<div id="action-title"></div>
		<div id="action-sub"></div>
		<div id="action-buttons">
			<button id="action-add" type="button" data-zg-str="action-add">Add to Zotero</button>
			<button id="action-close" type="button" data-zg-str="action-close">Close</button>
		</div>
	</div>

	<!-- The node context menu, and the canvas one. Built per node in graph.js.
	     A sibling for the same reason as the two above. -->
	<div id="menu" hidden="hidden"></div>

	<!-- A group's card: the anchor's own filter box, opened by "Group here" on
	     the canvas menu and by "Edit group" on a flag. It authors masks exactly
	     as the panel's box does -- same chips, same completion list -- but
	     these masks say what the anchor PULLS, not what the graph shows. -->
	<div id="group" hidden="hidden">
		<!-- No data-zg-str on the title: openGroup() rewrites it per flag, and
		     which of the two names it takes is not a fact the markup knows. -->
		<div id="group-title" data-zg-title="group-drag-hint" title="Drag to move this card">Group here</div>
		<div id="group-chips" hidden="hidden"></div>
		<input id="group-input" type="text" autocomplete="off" spellcheck="false"
			data-zg-placeholder="group-placeholder" placeholder="what belongs here — author:, year:, …"
			data-zg-title="group-hint"
			title="Type a term, or field:value. Filters stack: each one narrows what this anchor pulls."
			role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filter-suggest"/>
		<div id="group-sub"></div>
		<div id="group-buttons">
			<button id="group-remove" type="button" data-zg-str="group-remove">Remove</button>
			<button id="group-close" type="button" data-zg-str="group-done">Done</button>
		</div>
	</div>

	<!-- The search field's result list. Out here rather than under the field,
	     because #bar is 41px tall and clips: a ten-row list hung inside it would
	     be a sliver. graph.js places it against the field by hand, the way
	     #filter-suggest is placed against the filter box.

	     Its own element rather than a second user of #filter-suggest, which is
	     one shared node with a suggestBox pointer -- sound only because a single
	     box can hold the focus at a time, which stops being true the moment
	     there are two boxes on screen. -->
	<div id="search-suggest" role="listbox" hidden="hidden"></div>

	<!-- The filter box's completion list. Out here rather than under the box it
	     completes, because #side-body scrolls and clips: a twelve-row list
	     opened from a control halfway down the sidebar would be cut in half.
	     graph.js places it against the input by hand, the way #menu is placed
	     against the pointer. -->
	<div id="filter-suggest" role="listbox" hidden="hidden"></div>

	<!-- Every script is a same-origin resource:// URL, so no inline script is
	     needed and every CSP configuration in Zotero 7-11 allows them. -->
	<script src="lib/force-graph.min.js"></script>
	<!-- Strings before anything that draws with them: ftl.js is the reader,
	     l10n.js publishes window.zgSetStrings for chrome to push the .ftl
	     source into. -->
	<script src="ftl.js"></script>
