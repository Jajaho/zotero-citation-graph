<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>Citation Graph</title>
	<link rel="stylesheet" href="graph.css"/>
</head>
<body>
	<!-- The controls float over the canvas rather than sitting in a bar above
	     it: the graph is the point of the window, and on a narrow Zotero pane
	     the old wrapping toolbar ate several lines of it. Anchored top left,
	     and collapsible down to its header when the nodes underneath matter
	     more than the settings. -->
	<div id="panel">
		<!-- The whole header toggles, not just the chevron: it is a wide, easy
		     target, and there is nothing else in the header to click. -->
		<button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" title="Collapse controls">
			<span id="panel-chevron">▾</span>
			<span id="panel-title">settings</span>
		</button>

		<div id="panel-body">
			<!-- Scope. Both of these change what gets derived, so they cost a
			     rebuild; everything after them only filters the built graph. -->
			<div class="group">
				<label title="Include items from every subcollection">
					<input id="recursive" type="checkbox"/>
					subcollections
				</label>
				<label title="Show cited works that are not in the collection">
					<input id="include-external" type="checkbox"/>
					outside refs
				</label>
				<label id="min-cites-label" title="Hide outside works cited by fewer than this many of your papers">
					cited by ≥
					<input id="min-cites" type="number" min="1" max="20" step="1" value="2"/>
				</label>
				<!-- The only control that reaches the network. Off by default,
				     and independent of "outside refs": with ghosts off it still
				     has the held items' own DOIs to look up, which is where the
				     global citation counts come from. -->
				<label id="enrich-label" title="Look up citation counts, and titles and authors for outside works (uses the OpenAlex API)">
					<input id="enrich" type="checkbox"/>
					look up names
				</label>
			</div>

			<div class="group">
				<label>
					colour
					<select id="color-by">
						<option value="year">year</option>
						<option value="collection">collection</option>
						<option value="author">first author</option>
						<option value="publication">publication</option>
						<option value="type">item type</option>
					</select>
				</label>
				<!-- Applies to outside refs as well as held items. "global citations"
				     needs the counts "look up names" fetches, so picking it switches
				     that on and rebuilds rather than sitting there greyed out: the
				     user asked for the sizing, not for a lecture about a prerequisite.
				     The lookup is still never entered on its own. -->
				<label>
					size
					<select id="size-by">
						<option value="here">cited here</option>
						<option value="global">global citations</option>
					</select>
				</label>
				<!-- Layout, not a filter: nothing enters or leaves the graph. A
				     dense collection packs into balls because every edge pulls at
				     full strength; slackening the edges lets charge repulsion win
				     and the clusters open up far enough to read. -->
				<label id="pull-label" title="How hard a link pulls its two nodes together. Lower spreads a crowded graph out.">
					edge pull
					<input id="link-pull" type="range" min="0" max="2" step="0.05" value="1"/>
					<span id="pull-value">1.00</span>
				</label>
			</div>

			<!-- Filters. Each one is a mask over the held items, and they stack:
			     every filter added narrows what is left, never widens it. The
			     suggestions are drawn from the items that survive the filters
			     already applied, so an offered value can never empty the graph. -->
			<div class="group" id="filter-group">
				<div id="filter-chips"></div>
				<input id="filter-input" type="text" autocomplete="off" spellcheck="false"
					placeholder="filter — author:, year:, …"
					title="Type a term, or field:value. Filters stack: each one narrows what is left."
					role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filter-suggest"/>
			</div>

			<div id="strategies" class="group"></div>

			<div class="group">
				<label id="conf-label">
					min confidence
					<input id="min-conf" type="range" min="0" max="1" step="0.05" value="0"/>
					<span id="conf-value">0.00</span>
				</label>
				<label>
					<input id="hide-isolated" type="checkbox"/>
					hide unconnected
				</label>
				<!-- Only present while a node is isolated. Isolation is otherwise
				     invisible up here, and there would be nothing to tell a user how
				     to get the rest of the graph back. -->
				<button id="isolate-clear" type="button" hidden="hidden"></button>
				<!-- How far an isolation reaches. Always visible, unlike the button
				     above: it is a setting about how you read a graph, and one you
				     want to be able to find before you have isolated anything. -->
				<label id="depth-label" title="How many edges out from an isolated node stays lit">
					isolation depth
					<input id="isolate-depth" type="range" min="1" max="4" step="1" value="1"/>
					<span id="isolate-depth-value">1</span>
				</label>
			</div>

			<div class="group" id="panel-foot">
				<span id="stats"></span>
				<button id="rebuild" type="button">Rebuild</button>
			</div>
		</div>
	</div>

	<div id="graph"></div>

	<!-- What the node colours mean, in the corner opposite the controls: the
	     legend answers a question you ask while reading the graph, not while
	     changing it. Built per render in graph.js, and hidden until there is
	     something to explain. Sibling of #graph for the same reason as the
	     panel: force-graph empties its container. -->
	<div id="legend" hidden="hidden">
		<button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-body" title="Collapse legend">
			<span id="legend-chevron">▾</span>
			<span id="legend-title"></span>
		</button>
		<div id="legend-body"></div>
	</div>

	<!-- Bottom left, the corner nothing else claims: after dragging a node off
	     screen, or a rebuild that lands a bigger graph than the viewport, there
	     was no way back short of scrolling around hunting for the nodes. -->
	<button id="reframe" type="button" title="Fit the whole graph in view" aria-label="Fit the whole graph in view">⤢</button>

	<!-- Outside #graph deliberately: force-graph's init() does
	     container.innerHTML = "", which would delete anything nested inside.
	     Same reason the action popover is a sibling and not a child. -->
	<div id="status">Loading…</div>

	<!-- An outside reference's detail card, opened by double-clicking it.
	     Adding to Zotero is a write to the library, so from here it is behind an
	     explicit button -- a stray double click while panning must not file a
	     paper. The right-click menu adds without asking, because a menu entry
	     cannot be hit by accident. -->
	<div id="action" hidden="hidden">
		<div id="action-title"></div>
		<div id="action-sub"></div>
		<div id="action-buttons">
			<button id="action-add" type="button">Add to Zotero</button>
			<button id="action-close" type="button">Close</button>
		</div>
	</div>

	<!-- The node context menu, and the canvas one. Built per node in graph.js.
	     A sibling for the same reason as the two above. -->
	<div id="menu" hidden="hidden"></div>

	<!-- A group's card: the anchor's own filter box, opened by "Group here" on
	     the canvas menu and by "Edit group" on a flag. It authors masks exactly
	     as the panel's box does -- same chips, same completion list -- but
	     these masks say what the anchor PULLS, not what the graph shows. -->
	<div id="group" hidden="hidden">
		<div id="group-title">Group here</div>
		<div id="group-chips" hidden="hidden"></div>
		<input id="group-input" type="text" autocomplete="off" spellcheck="false"
			placeholder="what belongs here — author:, year:, …"
			title="Type a term, or field:value. Filters stack: each one narrows what this anchor pulls."
			role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filter-suggest"/>
		<div id="group-sub"></div>
		<div id="group-buttons">
			<button id="group-remove" type="button">Remove</button>
			<button id="group-close" type="button">Done</button>
		</div>
	</div>

	<!-- The filter box's completion list. Out here rather than under the box it
	     completes, because #panel and #panel-body both clip: a twelve-row list
	     opened from a control halfway down the panel would be cut in half.
	     graph.js places it against the input by hand, the way #menu is placed
	     against the pointer. -->
	<div id="filter-suggest" role="listbox" hidden="hidden"></div>

	<!-- Every script is a same-origin resource:// URL, so no inline script is
	     needed and every CSP configuration in Zotero 7-11 allows them. -->
	<script src="lib/force-graph.min.js"></script>
	<script src="nodeScale.js"></script>
	<script src="nodeLinks.js"></script>
	<script src="nodeFilters.js"></script>
	<script src="graph.js"></script>
</body>
</html>
