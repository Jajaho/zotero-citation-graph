# Load the built XPI into a Zotero build, drive its menus, and fail on the
# plugin's console errors (tools/smoke/run.js, issue #30).
#
# One action so that ci.yml, release.yml and smoke.yml run the same thing: the
# same libraries, the same Zotero download, the same report. It expects the XPI
# to be built and checked by the caller already, alone in xpi-dir.
#
# Which Zotero (the zotero input):
#   release, beta, dev  whatever zotero.org hands out for that channel today,
#                       not a pinned version. That is the point: #26 broke when
#                       the 11 beta moved to a new Gecko, with no change on our
#                       side, and nothing noticed until a user did.
#   min                 the oldest Zotero the plugin accepts: the release build
#                       named by strict_min_version in the manifest input. The
#                       point releases of one major share their Gecko; the risk
#                       is at the floor, where an API a later point release
#                       added would break everyone below it.
#
# Time. run.js launches Zotero once per shipped locale (two today). A pass
# takes about 30 s on a desktop; a run in which every case waits out its 30 s
# took 4.5 minutes (0.78.2 on the 11 beta). run.js stops itself after 15
# minutes (--timeout 900) and still writes its report; `timeout` cuts it off
# after 17 (SMOKE_MINUTES) in case it hangs past that. Callers give the step
# 25 minutes, so a hang ends as a failed step and the summary and the report
# upload below still run: a step or job timeout would cancel the whole action
# and skip them.
name: Smoke test
description: Run tools/smoke/run.js against a built XPI in a Zotero channel's current build, or in the oldest Zotero the plugin accepts.

inputs:
  zotero:
    description: Which Zotero to fetch, release, beta or dev (that channel's current build) or min (strict_min_version's release)
    required: true
  manifest:
    description: For zotero min, the manifest.json whose strict_min_version names the build
    required: false
    default: addon/manifest.json
  xpi-dir:
    description: Directory holding the one built XPI to test
    required: false
    default: dist
  xvfb:
    # The switch. Headless Gecko has no display at all; if Zotero's context
    # menus turn out to need one, set this default to 'true' and every smoke
    # job runs Zotero headed under a virtual X server instead.
    description: Run Zotero headed under xvfb-run instead of headless
    required: false
    default: 'false'

outputs:
  version:
    description: The Zotero version the smoke test ran on
    value: ${{ steps.zotero.outputs.version }}

runs:
  using: composite
  steps:
    # What Zotero's ELF files link against outside their own directory (readelf
    # NEEDED over the Linux tarball of 10.0.8 and 11.0-beta.6, both the same
    # list), under Ubuntu 24.04's package names. The runner image has most of
    # them already, for its own Firefox; installing a present package is a
    # no-op, and naming them all means a leaner image cannot fail the job with
    # "libasound.so.2: cannot open shared object file", which is what a
    # missing one looks like. libc6, libstdc++6 and libgcc-s1 are left out:
    # nothing on Ubuntu runs without them.
    #
    # Acquire::Retries because a mirror that hiccups would otherwise fail the
    # job, and in release.yml a failed job means no XPI attached.
    - name: Install the libraries Zotero links against
      shell: bash
      env:
        XVFB: ${{ inputs.xvfb }}
      run: |
        set -euo pipefail
        packages=(
          libasound2t64 libatk1.0-0t64 libcairo-gobject2 libcairo2 libdbus-1-3
          libfontconfig1 libfreetype6 libgdk-pixbuf-2.0-0 libglib2.0-0t64
          libgtk-3-0t64 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1
          libxcb-shm0 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6
          libxfixes3 libxi6 libxrandr2 libxrender1
        )
        if [ "$XVFB" = true ]; then packages+=(xvfb xauth); fi
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends "${packages[@]}"

    # fetch-zotero.js retries zotero.org and the download itself.
    - name: Fetch Zotero
      id: zotero
      shell: bash
      env:
        ZOTERO: ${{ inputs.zotero }}
        MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        case "$ZOTERO" in
          release|beta|dev) which=(--channel "$ZOTERO") ;;
          min) which=(--version min --manifest "$MANIFEST") ;;
          *) echo "::error::the zotero input is release, beta, dev or min, not $ZOTERO"; exit 1 ;;
        esac
        node tools/smoke/fetch-zotero.js "${which[@]}" --dir "$RUNNER_TEMP/zotero"

    # The smoke run gets a copy of the XPI, outside the workspace, so nothing
    # it does can change or add to the directory the caller attaches from.
    - name: Smoke test
      id: smoke
      shell: bash
      env:
        ZOTERO: ${{ steps.zotero.outputs.binary }}
        REPORT: ${{ runner.temp }}/smoke-report-${{ inputs.zotero }}.json
        XVFB: ${{ inputs.xvfb }}
        XPI_DIR: ${{ inputs.xpi-dir }}
        SMOKE_MINUTES: '17'
      run: |
        set -euo pipefail
        xpis=("$XPI_DIR"/*.xpi)
        if [ "${#xpis[@]}" -ne 1 ] || [ ! -f "${xpis[0]}" ]; then
          echo "::error::expected exactly one XPI in $XPI_DIR, found: ${xpis[*]}"
          exit 1
        fi
        copy="$RUNNER_TEMP/smoke-xpi/$(basename "${xpis[0]}")"
        rm -rf "$RUNNER_TEMP/smoke-xpi"
        mkdir -p "$RUNNER_TEMP/smoke-xpi"
        cp "${xpis[0]}" "$copy"
        cmd=(npm run smoke -- --zotero "$ZOTERO" --xpi "$copy" --report "$REPORT" --timeout 900)
        if [ "$XVFB" = true ]; then cmd=(xvfb-run --auto-servernum "${cmd[@]}" --headed); fi
        rc=0
        timeout --kill-after=30s "${SMOKE_MINUTES}m" "${cmd[@]}" || rc=$?
        if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
          echo "::error::the smoke test did not finish within $SMOKE_MINUTES minutes"
        fi
        exit "$rc"

    # Which Zotero it ran on, each locale's cases and the allow.json entries
    # belong on the run's page: a channel names no version, and next week's
    # run may meet a different one. tools/smoke/summary.js says so
    # when there is no report, and never fails.
    - name: Summary
      if: ${{ !cancelled() && steps.zotero.outcome == 'success' }}
      shell: bash
      env:
        LABEL: ${{ inputs.zotero == 'min' && 'the oldest Zotero the plugin accepts' || format('{0} channel', inputs.zotero) }}
        REPORT: ${{ runner.temp }}/smoke-report-${{ inputs.zotero }}.json
      run: node tools/smoke/summary.js "$REPORT" --label "$LABEL" >> "$GITHUB_STEP_SUMMARY" || true

    # Whatever report there is, also from a run that timed out.
    - name: Upload the smoke report
      if: ${{ !cancelled() && steps.smoke.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: smoke-report-${{ inputs.zotero }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/smoke-report-${{ inputs.zotero }}.json
        if-no-files-found: warn
