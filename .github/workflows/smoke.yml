# Weekly smoke test against Zotero's current release, beta and dev builds, and
# the oldest Zotero the plugin accepts.
#
# Zotero can break the plugin without a commit on our side: #26 broke when the
# Zotero 11 beta moved to Gecko 153, while the manifest already claimed 11, and
# nothing ran on 11 until a user reported it on the forums. So once a week this
# builds main and loads it into whatever zotero.org hands out on each channel.
# A release failure is a user-facing bug; a beta failure is the early warning.
# Zotero ignores strict_max_version on beta and dev builds, so the beta job also
# tests the next major before the manifest admits it: its passing is what lets
# strict_max_version go up (CONTRIBUTING.md, Supported Zotero versions).
#
# dev runs ahead of beta and breaks for reasons of its own, so its job only
# warns: it fails in its own row and in the run's summary, but the run stays
# green and sends no email. The minimum job pins the release that
# strict_min_version names in the ref's manifest, because that is where an API
# the plugin started using too early would show.
#
# GitHub emails the repository's owner when a scheduled run fails. Scheduled
# workflows run from the default branch's copy of this file, and GitHub turns
# the schedule off after 60 days without activity in the repository.
#
# Run it by hand to test another ref. The ref only decides which plugin is
# built; the smoke test itself is always this commit's. An older ref has no
# tools/smoke/ at all, or an older one, and the question is whether that
# plugin works, not whether its tooling does. A commit must be given as its
# full 40-character SHA: actions/checkout takes anything shorter for a branch
# name. The 0.78.2 commit, ffa844e761f8eeef1a566d7807bcca7ecb49bc65, has no
# tag and is expected to fail on every channel: on Zotero 10 with the Fluent
# parser errors (#27), and on Zotero 11 with the menu entries doing nothing
# as well (#26).
name: Smoke

on:
  schedule:
    # Mondays, 04:23 UTC: off the hour, when scheduled runs queue the longest.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose plugin to build and test (branch, tag or full 40-character commit SHA)
        required: false
        default: main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.zotero }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: ${{ matrix.zotero == 'dev' }}
    strategy:
      # Each Zotero's answer is worth having on its own: a beta failure must
      # not cancel the release run, nor the other way round.
      fail-fast: false
      matrix:
        zotero: [min, release, beta, dev]
    steps:
      # The test: the commit this workflow runs from. Neither checkout keeps
      # a token in .git/config: the job runs a Zotero downloaded from outside,
      # and nothing in it uses git with credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The plugin under test. A schedule has no inputs, so it builds main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          path: under-test
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # With the ref's own packer and verifier, so the XPI is the one that ref
      # released, byte for byte.
      - name: Build XPI
        working-directory: under-test
        run: npm run build

      - name: Check the XPI is loadable
        working-directory: under-test
        run: node tools/verify-xpi.js

      - name: Smoke test on Zotero (${{ matrix.zotero }})
        uses: ./.github/actions/smoke
        timeout-minutes: 25
        with:
          zotero: ${{ matrix.zotero }}
          xpi-dir: under-test/dist
          manifest: under-test/addon/manifest.json
