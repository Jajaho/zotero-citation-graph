# Build verification for the plugin.
#
# Runs on pushes to main and on demand. Day-to-day work happens on dev, which is
# deliberately not a trigger -- the gate is what reaches main, not every commit
# on the way there. Use the Run workflow button to check a branch before merging.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install -- the test harness and the packer are both
      # plain Node against the standard library.

      - name: Version gate
        run: npm run check-version

      - name: Tests
        run: npm test

      - name: Build XPI
        run: npm run build

      - name: Check the XPI is loadable
        run: node tools/verify-xpi.js

      # Load it into Zotero's current release and drive the menus (#30): the
      # same check release.yml makes before attaching, here on every push to
      # main, so a broken build shows before a release is cut from it. The
      # beta channel is smoke.yml's weekly job: a beta that breaks something
      # must not turn main red for a fix the release needs.
      - name: Smoke test on Zotero's release channel
        uses: ./.github/actions/smoke
        timeout-minutes: 20
        with:
          channel: release

      # The published checksum is the whole point: a user has to be able to
      # rebuild the tag and get the same bytes. Building twice and comparing
      # proves the packer is not smuggling in a timestamp or a directory order.
      # This runs on Linux while day-to-day builds happen on a Windows desktop, so
      # it is also the cross-platform half of the claim. The released XPI itself
      # comes from release.yml, which repeats this check on the tag.
      - name: Build again and compare
        run: |
          set -euo pipefail
          first=$(sha256sum dist/*.xpi | cut -d' ' -f1)
          rm -rf dist
          npm run build >/dev/null
          second=$(sha256sum dist/*.xpi | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible: $first then $second"
            exit 1
          fi
          echo "reproducible: $first"

      - name: Write checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.xpi | tee SHA256SUMS

      - name: Upload XPI
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: |
            dist/*.xpi
            dist/SHA256SUMS
          if-no-files-found: error
