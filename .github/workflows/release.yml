# Attach the XPI to a GitHub release.
#
# Releases are still written by hand -- title, notes, tag -- and this runs when one
# is published. v0.72.4 went out with no asset at all (issue #3), and because
# updates.json points every installed copy at that asset, auto-update hit a 404:
# a release page without its XPI does not merely look unfinished, it breaks
# updating. So the upload is no longer something a person has to remember.
#
# Run it by hand (Run workflow, with a tag) to backfill a release that predates it.
#
# Only the XPI is attached. GitHub shows every asset's SHA-256 on the release page,
# so a SHA256SUMS file would only repeat it. The checksum we care about is the one
# anyone gets by rebuilding the tag, and the double build below holds us to it.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the XPI to (e.g. v0.72.4)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    name: Build and attach XPI
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Build what the tag names, not whatever branch the run happens to start on.
      #
      # persist-credentials: false keeps the token out of .git/config. This
      # job's token can write releases, and the smoke test below runs npm, the
      # plugin and a Zotero downloaded from outside; none of them needs it, and
      # no step here uses git with credentials. The steps that talk to GitHub
      # pass GH_TOKEN to gh and curl themselves.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package.json, addon/manifest.json, the tag and updates.json must all
      # name the same version, or the asset lands under the wrong name.
      - name: Version gate
        run: node tools/check-version.js --tag "$TAG"

      - name: Tests
        run: npm test

      - name: Build XPI
        run: npm run build

      - name: Check the XPI is loadable
        run: node tools/verify-xpi.js

      # The digest is kept as XPI_SHA256, for the check before the attach.
      - name: Build again and compare
        run: |
          set -euo pipefail
          first=$(sha256sum dist/*.xpi | cut -d' ' -f1)
          rm -rf dist
          npm run build >/dev/null
          second=$(sha256sum dist/*.xpi | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible: $first then $second"
            exit 1
          fi
          echo "reproducible: $first"
          echo "XPI_SHA256=$second" >> "$GITHUB_ENV"

      # The asset has to be at the URL updates.json gives Zotero. Check that
      # before uploading, so a link pointing at a different name fails here
      # and not as a 404 on every user's update check. The asset's name is
      # passed on to the steps below as ASSET.
      #
      # Tags before assetName() existed attach under the .xpi name their
      # updates.json already links to, so running this by hand on an old tag
      # still puts the XPI where that release's link expects it.
      - name: Check updates.json points at this asset
        run: |
          node -e '
            const fs = require("fs");
            const { readVersions, xpiName, assetName = xpiName } = require("./tools/check-version.js");
            const { version } = readVersions({ assert: true });
            const id = JSON.parse(fs.readFileSync("addon/manifest.json", "utf8")).applications.zotero.id;
            const entry = JSON.parse(fs.readFileSync("updates.json", "utf8"))
              .addons[id].updates.find(u => u.version === version);
            const want = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/${assetName(version)}`;
            if (entry.update_link !== want) {
              console.error(`::error::updates.json update_link is ${entry.update_link}, expected ${want}`);
              process.exit(1);
            }
            console.log(`update_link ok: ${want}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ASSET=${assetName(version)}\n`);
          '

      # Never attach a build that fails in Zotero itself. #26 and #27 both
      # shipped with errors that only a real Zotero's console showed (#30).
      # Zotero's current release, which most of this asset's users run, and
      # the oldest Zotero its manifest accepts, which some still do.
      # GH_TOKEN, which can write this repository's releases, is emptied for
      # the step, and the checkout above left no token in .git/config, so
      # nothing the smoke run starts can reach it. The smoke run tests a copy
      # of the XPI outside dist/, and the step after it checks dist/ again.
      #
      # This blocks the attach on anything that fails the smoke job, the
      # apt mirror and zotero.org included, while updates.json may already
      # send update checks to the missing asset. To recover: "Re-run failed
      # jobs" on this run, or run this workflow by hand with the tag. Both are
      # safe at any time: the attach step uploads only when the asset is
      # missing, and never replaces one.
      #
      # Tags from before the smoke test (v0.78.4 and older) have no
      # .github/actions/smoke and were released without it. Running this by
      # hand on one of them says so and goes on to the attach step, which
      # still never touches an asset that is already there.
      - name: Smoke test on Zotero's release channel
        id: smoke_release
        if: hashFiles('.github/actions/smoke/action.yml') != ''
        uses: ./.github/actions/smoke
        timeout-minutes: 25
        env:
          GH_TOKEN: ''
        with:
          zotero: release

      # Also when only the release run failed, so one run gives both answers.
      # The attach below still needs both to pass.
      - name: Smoke test on the oldest Zotero the plugin accepts
        if: ${{ (success() || steps.smoke_release.outcome == 'failure') && hashFiles('.github/actions/smoke/action.yml') != '' }}
        uses: ./.github/actions/smoke
        timeout-minutes: 25
        env:
          GH_TOKEN: ''
        with:
          zotero: min

      - name: Note a tag without a smoke test
        if: hashFiles('.github/actions/smoke/action.yml') == ''
        run: echo "::warning::$TAG predates the smoke test (issue #30); it is attached without one"

      # What gets attached is what was built and compared above, and nothing
      # else: dist/ must still hold that one XPI and no other file.
      - name: Check dist/ still holds the XPI that was built
        run: |
          set -euo pipefail
          mapfile -t files < <(ls -A dist)
          if [ "${#files[@]}" -ne 1 ] || [[ "${files[0]}" != *.xpi ]]; then
            echo "::error::dist/ should hold exactly the one XPI, but holds: ${files[*]}"
            exit 1
          fi
          got=$(sha256sum "dist/${files[0]}" | cut -d' ' -f1)
          if [ "$got" != "$XPI_SHA256" ]; then
            echo "::error::dist/${files[0]} is $got now, but the build made $XPI_SHA256"
            exit 1
          fi
          echo "unchanged since the build: ${files[0]} $got"

      # Never overwrite an asset that is already there. If it holds the same
      # bytes there is nothing to do. If it holds different bytes, something
      # other than the tag produced it, and that is for a person to look at.
      #
      # The upload goes through the REST endpoint because the asset's name
      # differs from the built file's (.XPI, not .xpi; see assetName() in
      # tools/check-version.js), and `gh release upload` names an asset after
      # its file. GitHub sets the served Content-Type from that name.
      - name: Attach to release
        run: |
          set -euo pipefail
          file=$(ls dist/*.xpi)
          local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          release=$(gh api "repos/$REPO/releases/tags/$TAG")
          existing=$(jq -r --arg n "$ASSET" '.assets[] | select(.name == $n) | .digest' <<<"$release")
          if [ -z "$existing" ]; then
            upload_url=$(jq -r '.upload_url | split("{")[0]' <<<"$release")
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "$upload_url?name=$ASSET" >/dev/null
            echo "attached $ASSET ($local_digest)"
          elif [ "$existing" = "$local_digest" ]; then
            echo "$ASSET already attached with the same bytes ($local_digest)"
          else
            echo "::error::$ASSET is already attached with $existing, but the tag builds $local_digest"
            exit 1
          fi

      # Fetch it the way Zotero will, through the link updates.json gives, and
      # check those are the bytes we built. Then check the type it is served
      # under: application/x-xpinstall means a click on the download link in
      # Firefox becomes an attempt to install the plugin into Firefox.
      - name: Download via update_link and compare
        run: |
          set -euo pipefail
          file=$(ls dist/*.xpi)
          url="https://github.com/$REPO/releases/download/$TAG/$ASSET"
          curl -sSLf --retry 5 --retry-delay 3 -o /tmp/published.xpi "$url"
          want=$(sha256sum "$file" | cut -d' ' -f1)
          got=$(sha256sum /tmp/published.xpi | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$url serves $got, expected $want"
            exit 1
          fi
          echo "published asset matches: $got"
          type=$(curl -sSLI --retry 5 --retry-delay 3 -o /dev/null -w '%{content_type}' "$url")
          if [ "$type" = "application/x-xpinstall" ]; then
            case "$ASSET" in
              *.xpi) echo "::warning::$url is served as $type, which Firefox tries to install. This tag predates the .XPI asset name." ;;
              *) echo "::error::$url is served as $type, which Firefox tries to install"; exit 1 ;;
            esac
          fi
          echo "served as: $type"
